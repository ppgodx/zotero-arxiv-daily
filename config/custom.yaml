zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: ${oc.env:SMTP_SERVER}
  smtp_port: ${oc.decode:${oc.env:SMTP_PORT}}
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:GEMINI_API_KEY}
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_mode: chat_completion
  generation_kwargs:
    model: gemini-4-hydrogen
  language: ${oc.env:LANGUAGE,Chinese}

source:
  arxiv:
    # Preserve the existing RSS query, including any '+'-joined categories.
    category: ["${oc.env:ARXIV_QUERY}"]

executor:
  debug: ${oc.decode:${oc.env:DEBUG,false}}
  source: ['arxiv']
